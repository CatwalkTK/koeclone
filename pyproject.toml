[project]
name = "koeclone"
version = "0.1.0"
description = "ローカル音声クローン・テキスト読み上げシステム（単一ユーザー・日本語）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chatterbox-tts>=0.1.7",
    "fastapi>=0.116",
    "python-multipart>=0.0.32",
    "resemble-perth>=1.0.1",
    "static-ffmpeg>=3.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
    "ruff>=0.12",
    "pytest-playwright>=0.8.0",
]

[tool.uv.sources]
chatterbox-tts = { git = "https://github.com/resemble-ai/chatterbox.git", rev = "5de7a54aa4e5e2baadb0182dde554908b48b85c2" }

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "real_model: 実モデル（Chatterbox Multilingual V3）をロードする契約テスト。基準Macでのみ実行する",
]
